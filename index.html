<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="logo">MUSIC</div>
            <div class="nav-links">
                <a href="index.html" class="active">Home</a>
                <a href="playlist.html">Playlists</a>
            </div>
        </nav>

        <main class="home-content">
            <div class="hero">
                <h1>Your Music, Simplified</h1>
                <p>Listen to your favorite tracks</p>
            </div>

            <div class="tracks">
                <h2>Recent Tracks</h2>
                <div class="track-list">
                    <div class="track-item" data-song="0">
                        <div class="track-info">
                            <div class="track-title">Midnight Dreams</div>
                            <div class="track-artist">Luna Echo</div>
                        </div>
                        <button class="play-btn">▶</button>
                    </div>
                    <div class="track-item" data-song="1">
                        <div class="track-info">
                            <div class="track-title">Summer Breeze</div>
                            <div class="track-artist">Coastal Waves</div>
                        </div>
                        <button class="play-btn">▶</button>
                    </div>
                    <div class="track-item" data-song="2">
                        <div class="track-info">
                            <div class="track-title">Electric Nights</div>
                            <div class="track-artist">Neon Pulse</div>
                        </div>
                        <button class="play-btn">▶</button>
                    </div>
                    <div class="track-item" data-song="3">
                        <div class="track-info">
                            <div class="track-title">Morning Light</div>
                            <div class="track-artist">Dawn Chorus</div>
                        </div>
                        <button class="play-btn">▶</button>
                    </div>
                </div>
            </div>
        </main>

        <div class="player">
            <div class="player-info">
                <div class="song-title">Select a track</div>
                <div class="song-artist">No artist</div>
            </div>
            <div class="player-controls">
                <button id="prevBtn">⏮</button>
                <button id="playPauseBtn">▶</button>
                <button id="nextBtn">⏭</button>
            </div>
            <div class="progress-container">
                <span class="time" id="currentTime">0:00</span>
                <div class="progress-bar">
                    <div class="progress" id="progress"></div>
                </div>
                <span class="time" id="duration">0:00</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

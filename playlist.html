<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlists - Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="logo">MUSIC</div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="playlist.html" class="active">Playlists</a>
            </div>
        </nav>

        <main class="playlist-content">
            <div class="playlist-header">
                <h1>My Playlists</h1>
            </div>

            <div class="playlists">
                <!-- Playlists will be loaded dynamically -->
            </div>

            <div class="playlist-tracks">
                <h2>Select a playlist</h2>
                <div class="track-list">
                    <p style="color: #888; padding: 20px; text-align: center;">Click on a playlist above to view its songs</p>
                </div>
            </div>
        </main>

        <div class="player">
            <div class="player-info">
                <div class="song-title">Select a track</div>
                <div class="song-artist">No artist</div>
            </div>
            <div class="player-controls">
                <button id="prevBtn">⏮</button>
                <button id="playPauseBtn">▶</button>
                <button id="nextBtn">⏭</button>
            </div>
            <div class="progress-container">
                <span class="time" id="currentTime">0:00</span>
                <div class="progress-bar">
                    <div class="progress" id="progress"></div>
                </div>
                <span class="time" id="duration">0:00</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
